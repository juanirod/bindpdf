<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" shape-rendering="crispEdges">
  <title>BindPDF</title>
  <!-- Dark version, for #161b25. Grid: 1 unit = 1 pixel. -->
  <!-- Sheets, back to front: outline rect, then paper rect 1px inside -->
  <g id="sheet-back">
    <rect x="10" y="1" width="13" height="19" fill="#c9d0db"/>
    <rect x="11" y="2" width="11" height="17" fill="#5a6478"/>
  </g>
  <g id="sheet-middle">
    <rect x="8" y="3" width="13" height="19" fill="#c9d0db"/>
    <rect x="9" y="4" width="11" height="17" fill="#232a38"/>
  </g>
  <g id="sheet-front">
    <rect x="5" y="5" width="14" height="18" fill="#c9d0db"/>
    <rect x="6" y="6" width="12" height="16" fill="#232a38"/>
    <g id="text-lines" fill="#5a6478">
      <rect x="13" y="8" width="4" height="1"/>
      <rect x="13" y="10" width="4" height="1"/>
      <rect x="13" y="12" width="4" height="1"/>
      <rect x="13" y="14" width="4" height="1"/>
      <rect x="13" y="16" width="4" height="1"/>
      <rect x="13" y="18" width="4" height="1"/>
      <rect x="13" y="20" width="3" height="1"/>
    </g>
  </g>
  <!-- Binder clip on the left edge: spine on the left, mouth on the right -->
  <g id="clip">
    <g fill="#1b2230">
      <rect x="3" y="10" width="1" height="6"/>
      <rect x="4" y="9" width="1" height="8"/>
      <rect x="5" y="8" width="1" height="10"/>
      <rect x="6" y="7" width="6" height="12"/>
    </g>
    <g fill="#f2c230">
      <rect x="4" y="10" width="1" height="6"/>
      <rect x="5" y="9" width="1" height="8"/>
      <rect x="6" y="8" width="5" height="10"/>
    </g>
    <g id="clip-shine" fill="#ffffff">
      <rect x="5" y="9" width="1" height="1"/>
      <rect x="6" y="8" width="2" height="1"/>
    </g>
    <g id="clip-handle" fill="#e7ebf2">
      <rect x="0" y="8" width="1" height="10"/>
      <rect x="1" y="8" width="1" height="1"/>
      <rect x="1" y="17" width="1" height="1"/>
      <rect x="2" y="9" width="1" height="1"/>
      <rect x="2" y="16" width="1" height="1"/>
    </g>
  </g>
</svg>
