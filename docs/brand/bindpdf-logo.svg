<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 93 24" width="372" height="96" shape-rendering="crispEdges">
  <title>BindPDF</title>
  <!-- Light version, for #e9edf2 (also fine on white). Grid: 1 unit = 1 pixel. -->
  <g id="mark">
    <g id="sheet-back">
      <rect x="10" y="1" width="13" height="19" fill="#1b2230"/>
      <rect x="11" y="2" width="11" height="17" fill="#c9d0db"/>
    </g>
    <g id="sheet-middle">
      <rect x="8" y="3" width="13" height="19" fill="#1b2230"/>
      <rect x="9" y="4" width="11" height="17" fill="#ffffff"/>
    </g>
    <g id="sheet-front">
      <rect x="5" y="5" width="14" height="18" fill="#1b2230"/>
      <rect x="6" y="6" width="12" height="16" fill="#ffffff"/>
      <g id="text-lines" fill="#c9d0db">
        <rect x="13" y="8" width="4" height="1"/>
        <rect x="13" y="10" width="4" height="1"/>
        <rect x="13" y="12" width="4" height="1"/>
        <rect x="13" y="14" width="4" height="1"/>
        <rect x="13" y="16" width="4" height="1"/>
        <rect x="13" y="18" width="4" height="1"/>
        <rect x="13" y="20" width="3" height="1"/>
      </g>
    </g>
    <g id="clip">
      <g fill="#1b2230">
        <rect x="3" y="10" width="1" height="6"/>
        <rect x="4" y="9" width="1" height="8"/>
        <rect x="5" y="8" width="1" height="10"/>
        <rect x="6" y="7" width="6" height="12"/>
      </g>
      <g fill="#f2c230">
        <rect x="4" y="10" width="1" height="6"/>
        <rect x="5" y="9" width="1" height="8"/>
        <rect x="6" y="8" width="5" height="10"/>
      </g>
      <g id="clip-shine" fill="#ffffff">
        <rect x="5" y="9" width="1" height="1"/>
        <rect x="6" y="8" width="2" height="1"/>
      </g>
      <g id="clip-handle" fill="#1b2230">
        <rect x="0" y="8" width="1" height="10"/>
        <rect x="1" y="8" width="1" height="1"/>
        <rect x="1" y="17" width="1" height="1"/>
        <rect x="2" y="9" width="1" height="1"/>
        <rect x="2" y="16" width="1" height="1"/>
      </g>
    </g>
  </g>
  <!-- Wordmark: 2px-stroke bitmap letters, cap height 11. Each letter is drawn in its own local grid. -->
  <g id="wordmark-bind" fill="#1b2230">
    <g id="B" transform="translate(30 8)">
      <rect x="0" y="0" width="2" height="11"/>
      <rect x="2" y="0" width="4" height="2"/>
      <rect x="6" y="1" width="1" height="3"/>
      <rect x="5" y="2" width="1" height="2"/>
      <rect x="2" y="4" width="4" height="2"/>
      <rect x="6" y="5" width="1" height="5"/>
      <rect x="5" y="6" width="1" height="3"/>
      <rect x="2" y="9" width="4" height="2"/>
    </g>
    <g id="i" transform="translate(39 8)">
      <rect x="0" y="0" width="2" height="2"/>
      <rect x="0" y="3" width="2" height="8"/>
    </g>
    <g id="n" transform="translate(43 8)">
      <rect x="0" y="3" width="2" height="8"/>
      <rect x="2" y="3" width="4" height="2"/>
      <rect x="6" y="4" width="1" height="7"/>
      <rect x="5" y="5" width="1" height="6"/>
    </g>
    <g id="d" transform="translate(52 8)">
      <rect x="5" y="0" width="2" height="11"/>
      <rect x="1" y="3" width="4" height="2"/>
      <rect x="0" y="4" width="1" height="6"/>
      <rect x="1" y="5" width="1" height="4"/>
      <rect x="1" y="9" width="4" height="2"/>
    </g>
  </g>
  <!-- "PDF" on a yellow tag (the app's page-number tag) -->
  <g id="tag">
    <g fill="#f2c230">
      <rect x="64" y="5" width="28" height="17"/>
      <rect x="63" y="6" width="30" height="15"/>
    </g>
    <g id="wordmark-pdf" fill="#1b2230">
      <g id="P" transform="translate(66 8)">
        <rect x="0" y="0" width="2" height="11"/>
        <rect x="2" y="0" width="4" height="2"/>
        <rect x="6" y="1" width="1" height="5"/>
        <rect x="5" y="2" width="1" height="3"/>
        <rect x="2" y="5" width="4" height="2"/>
      </g>
      <g id="D" transform="translate(75 8)">
        <rect x="0" y="0" width="2" height="11"/>
        <rect x="2" y="0" width="4" height="2"/>
        <rect x="6" y="1" width="1" height="9"/>
        <rect x="5" y="2" width="1" height="7"/>
        <rect x="2" y="9" width="4" height="2"/>
      </g>
      <g id="F" transform="translate(84 8)">
        <rect x="0" y="0" width="2" height="11"/>
        <rect x="2" y="0" width="4" height="2"/>
        <rect x="2" y="4" width="3" height="2"/>
      </g>
    </g>
  </g>
</svg>
